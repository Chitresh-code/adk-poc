services:
  adk-agents:
    image: adk-poc-adk-agents
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./agents/.env
    environment:
      PYTHONUNBUFFERED: "1"
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: adk-poc-local
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8090
      FIRESTORE_PROJECT_ID: adk-poc-local
    depends_on:
      signal-seeder:
        condition: service_completed_successfully
      crm-seeder:
        condition: service_completed_successfully

  web:
    image: adk-poc-web
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - adk-agents

  signal-seeder:
    image: adk-poc-adk-agents
    command: ["uv", "run", "--frozen", "python", "account_research_agent/scripts/publish_fake_signals.py"]
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: adk-poc-local
      SEED_ONLY_ON_CREATE: "1"
    depends_on:
      pubsub-emulator:
        condition: service_healthy

  pubsub-emulator:
    image: google/cloud-sdk:emulators
    command: gcloud beta emulators pubsub start --project=adk-poc-local --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8085"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  crm-seeder:
    image: adk-poc-adk-agents
    command: ["uv", "run", "--frozen", "python", "revops_agent/scripts/seed_firestore.py"]
    environment:
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8090
      FIRESTORE_PROJECT_ID: adk-poc-local
    depends_on:
      firestore-emulator:
        condition: service_healthy

  firestore-emulator:
    image: google/cloud-sdk:emulators
    command: gcloud emulators firestore start --project=adk-poc-local --host-port=0.0.0.0:8090
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
