services:
  adk-agents:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./agents/.env
    environment:
      PYTHONUNBUFFERED: "1"
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: adk-poc-local
    volumes:
      - ./agents:/app/agents
    depends_on:
      - pubsub-emulator
    stdin_open: true
    tty: true

  pubsub-emulator:
    image: google/cloud-sdk:emulators
    command: gcloud beta emulators pubsub start --project=adk-poc-local --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
