server {
  listen 80;

  # ADK backend API, proxied same-origin so the frontend never needs CORS.
  # Path prefixes are exactly what the frontend calls, see
  # src/app/core/services/*.ts.
  location /apps/ {
    proxy_pass http://adk-agents:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /dev/ {
    proxy_pass http://adk-agents:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /list-apps {
    proxy_pass http://adk-agents:8080;
    proxy_set_header Host $host;
  }

  location = /version {
    proxy_pass http://adk-agents:8080;
    proxy_set_header Host $host;
  }

  location /config/ {
    proxy_pass http://adk-agents:8080;
    proxy_set_header Host $host;
  }

  location /agent-identity/ {
    proxy_pass http://adk-agents:8080;
    proxy_set_header Host $host;
  }

  # Server-sent events: buffering/caching would delay or break streaming.
  location = /run_sse {
    proxy_pass http://adk-agents:8080;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # WebSocket: needs the Upgrade/Connection handshake headers.
  location = /run_live {
    proxy_pass http://adk-agents:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Everything else is a static asset or an Angular client route.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
